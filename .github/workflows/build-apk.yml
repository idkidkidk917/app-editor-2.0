
name: CART3R ULTRA APK Builder

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android Components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract CART3R ULTRA
        run: |
          mkdir -p source
          unzip -q CART3R_ULTRA_Android_Project.zip -d source

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find source -type f -name gradlew -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build CART3R ULTRA
        run: |
          "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-ULTRA-APK
          path: "source/**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
