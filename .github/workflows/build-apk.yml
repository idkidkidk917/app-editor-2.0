
name: CART3R ULTRA APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q CART3R_ULTRA_Android_Project.zip -d source

      - name: Build CART3R ULTRA APK
        run: |
          gradle -p source/CART3R_ULTRA assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-ULTRA-APK
          path: source/CART3R_ULTRA/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          reten
          tion-days: 7
